name: flutter_ui_gallery
description: "66 accessible Flutter surface presets with coordinated themes, partial style overrides and caller-owned state."
version: 0.2.0
homepage: https://github.com/Ahmedelsapagh10/flutter_ui_gallery
repository: https://github.com/Ahmedelsapagh10/flutter_ui_gallery
issue_tracker: https://github.com/Ahmedelsapagh10/flutter_ui_gallery/issues
topics:
  - widgets
  - material-design
  - bottom-sheet
  - navigation
  - accessibility
screenshots:
  - description: "Six toast presets with success, undo, upload progress, and status messages."
    path: doc/assets/preview-toasts.png
  - description: "Orbit Dock and Depth Frame bottom sheets in light and dark mode."
    path: doc/assets/preview-sheets.png
  - description: "Side-by-Side Choice and Spotlight Result dialogs in light and dark mode."
    path: doc/assets/preview-dialogs.png
  - description: "Focus Bar and Sculpted Wave headers with Floating Cove and Glass Dock navigation."
    path: doc/assets/preview-navigation.png

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/flutter_ui_gallery.png
