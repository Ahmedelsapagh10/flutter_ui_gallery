<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Explore 66 Flutter sheets, dialogs, toasts, app bars and navigation presets. Compare coordinated themes, try real examples and copy Dart code.">
  <meta property="og:title" content="Flutter UI Gallery Playground">
  <meta property="og:description" content="66 interactive Flutter surfaces, three design families and copyable Dart setup.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ahmedelsapagh10.github.io/flutter_ui_gallery/">
  <meta property="og:image" content="https://ahmedelsapagh10.github.io/flutter_ui_gallery/assets/assets/flutter_ui_gallery.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flutter UI Gallery">
  <link rel="apple-touch-icon" href="assets/assets/flutter_ui_gallery.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/assets/flutter_ui_gallery.png"/>

  <!-- Google Fonts: Outfit, Plus Jakarta Sans, Alexandria -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <title>Flutter UI Gallery Playground</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
