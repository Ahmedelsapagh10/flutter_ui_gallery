name: Flutter CI

on:
  push:
    branches: ['codex/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Analyze and test (${{ matrix.sdk }})
    # Approved font-rendered goldens were captured on macOS 26 arm64.
    runs-on: ${{ matrix.sdk == 'pinned' && 'macos-26' || 'macos-15' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: pinned
            flutter: '3.41.9'
          - sdk: stable
            flutter: ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - name: Record SDK versions
        run: |
          flutter --version
          sw_vers
          uname -m
      - name: Verify approved legacy and Notes Pass A golden hashes
        run: python3 tool/check_golden_hashes.py
      - name: Verify Notes render SDK and font pins
        if: matrix.sdk == 'pinned'
        run: python3 tool/check_notes_pins.py
      - name: Verify Still example font pins
        run: python3 tool/check_still_pins.py
      - name: Resolve package dependencies
        run: flutter pub get
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Check formatting with the baseline Dart SDK
        if: matrix.sdk == 'pinned'
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test example/test_driver
      - name: Test package and visual baselines
        if: matrix.sdk == 'pinned'
        run: flutter test --no-pub
      - name: Test package on current stable
        if: matrix.sdk == 'stable'
        run: flutter test --no-pub --exclude-tags golden
      - name: Test example with pinned visual baselines
        if: matrix.sdk == 'pinned'
        working-directory: example
        run: flutter test --no-pub test
      - name: Test example on current stable
        if: matrix.sdk == 'stable'
        working-directory: example
        run: flutter test --no-pub test --exclude-tags golden
      - name: Generate every default and customized snippet
        working-directory: example
        run: flutter test --no-pub test/snippet_test.dart --dart-define=WRITE_SNIPPET_FIXTURE=true
      - name: Analyze package, example, and generated snippets
        run: flutter analyze --no-pub
      - name: Remove generated analyzer fixture
        if: always()
        run: rm -f example/lib/gallery/snippet_validation.dart
      - name: Upload visual differences
        if: failure() && matrix.sdk == 'pinned'
        uses: actions/upload-artifact@v4
        with:
          name: golden-differences
          path: |
            test/failures/
            example/test/failures/
          if-no-files-found: ignore

  android:
    name: Android build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build release APK
        working-directory: example
        run: flutter build apk --release
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android device smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: example
          script: flutter test integration_test/native_smoke_test.dart -d emulator-5554

  ios:
    name: iOS build and smoke
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install official iOS toolchain with simulator readiness fix
        shell: bash
        run: |
          # Stable 3.47.9 and pinned 3.41.9 lack flutter/flutter#193142.
          sdk_path="$RUNNER_TEMP/flutter-ios-sdk"
          git init "$sdk_path"
          git -C "$sdk_path" remote add origin https://github.com/flutter/flutter.git
          # Retain official version ancestry; a tagless shallow clone reports 0.0.0.
          git -C "$sdk_path" fetch --filter=blob:none --depth=2000 origin c3ed85ef987759ee54a6bce275490cde2a238dc1 refs/tags/3.50.0-0.1.pre:refs/tags/3.50.0-0.1.pre
          git -C "$sdk_path" checkout --detach FETCH_HEAD
          echo "$sdk_path/bin" >> "$GITHUB_PATH"
      - name: Record and verify iOS toolchain
        run: |
          flutter --version
          xcodebuild -version
          sw_vers
          uname -m
          test "$(git -C "$RUNNER_TEMP/flutter-ios-sdk" rev-parse HEAD)" = c3ed85ef987759ee54a6bce275490cde2a238dc1
          grep -F 'await logReader._ready.future' "$RUNNER_TEMP/flutter-ios-sdk/packages/flutter_tools/lib/src/ios/simulators.dart"
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build unsigned iOS release
        working-directory: example
        run: flutter build ios --release --no-codesign
      - name: Boot an available iPhone simulator
        id: simulator
        timeout-minutes: 5
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime, group in devices.items() if "iOS" in runtime for device in group if "iPhone" in device["name"]))')
          state=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["state"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["udid"] == sys.argv[1]))' "$device_id")
          if [ "$state" != Booted ]; then xcrun simctl boot "$device_id"; fi
          xcrun simctl bootstatus "$device_id" -b
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Verify smoke result gate
        run: python3 -m unittest discover -s tool -p test_ios_smoke.py -v
      - name: Run three consecutive iOS smoke executions
        timeout-minutes: 35
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: python3 tool/run_ios_smoke.py --device "$SIMULATOR_ID" --output "$RUNNER_TEMP/ios-smoke"
      - name: Upload every iOS smoke attempt and native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-diagnostics
          path: ${{ runner.temp }}/ios-smoke/
          if-no-files-found: warn
