name: Flutter CI

on:
  push:
    branches: ['codex/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Analyze and test (${{ matrix.sdk }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: pinned
            flutter: '3.41.9'
          - sdk: stable
            flutter: ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - name: Record SDK versions
        run: flutter --version
      - name: Resolve package dependencies
        run: flutter pub get
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Check formatting with the baseline Dart SDK
        if: matrix.sdk == 'pinned'
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test example/test_driver
      - name: Test package and visual baselines
        if: matrix.sdk == 'pinned'
        run: flutter test --no-pub
      - name: Test package on current stable
        if: matrix.sdk == 'stable'
        run: flutter test --no-pub --exclude-tags golden
      - name: Test example
        working-directory: example
        run: flutter test --no-pub test
      - name: Generate every default and customized snippet
        working-directory: example
        run: flutter test --no-pub test/snippet_test.dart --dart-define=WRITE_SNIPPET_FIXTURE=true
      - name: Analyze package, example, and generated snippets
        run: flutter analyze --no-pub
      - name: Remove generated analyzer fixture
        if: always()
        run: rm -f example/lib/gallery/snippet_validation.dart
      - name: Upload visual differences
        if: failure() && matrix.sdk == 'pinned'
        uses: actions/upload-artifact@v4
        with:
          name: golden-differences
          path: test/failures/
          if-no-files-found: ignore

  android:
    name: Android build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build release APK
        working-directory: example
        run: flutter build apk --release --no-pub
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android device smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: example
          script: flutter test --no-pub integration_test/native_smoke_test.dart -d emulator-5554

  ios:
    name: iOS build and smoke
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build unsigned iOS release
        working-directory: example
        run: flutter build ios --release --no-codesign --no-pub
      - name: Boot an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime, group in devices.items() if "iOS" in runtime for device in group if "iPhone" in device["name"]))')
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Run iOS device smoke
        working-directory: example
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: flutter test --no-pub integration_test/native_smoke_test.dart -d "$SIMULATOR_ID"
